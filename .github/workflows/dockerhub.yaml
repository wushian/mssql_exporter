name: DockerHub

# Builds the image on every push / PR. Pushes to Docker Hub only when the repository has
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets; without them the job still builds and
# stays green instead of failing at login. The image is named after the Docker Hub user.
on:
  push:
    branches:
      - "develop"
    tags:
      - "v*"
  pull_request:
    branches:
      - "develop"
  release:
    types: [published]
jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/mssql_exporter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
