# 加到 prometheus.yml 的 scrape_configs 底下。
# mssql_exporter：每次 scrape 即時查，適合輕量 DMV，scrape_timeout 要大於 metrics.json 的 MillisecondTimeout 加 2 秒。
# sql_exporter：  背景排程，/metrics 只回快取，scrape 很快；查詢頻率由 config.yml 的 interval 決定。
scrape_configs:
  - job_name: 'mssql_exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:80']

  - job_name: 'sql_exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['localhost:9237']
